# Pre-commit hooks for github.com/gorrie/bias-study.
#
# Install once per clone:
#   python -m pip install pre-commit
#   python -m pre_commit install
#
# Then every `git commit` runs these checks before the commit lands.
# To run manually against all files (not just staged):
#   python -m pre_commit run --all-files
#
# Primary: gitleaks (open-source, fast, sees the entire diff including
# moved/renamed files). The repo's own ADVERSARIAL-REVIEW and bias-barometer
# spec both call out "secrets never ship" as a hard rule — this is the
# mechanical enforcement layer.
#
# The .env.example template intentionally contains placeholder text like
# `sk-or-v1-REPLACE_WITH_YOUR_OWN_KEY` — that pattern is allowlisted in
# .gitleaks.toml so it does not fail the hook.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: Detect leaked credentials
        description: >
          Scan staged content for API keys, tokens, and other secret patterns.
          Configuration in .gitleaks.toml (allowlists templates / docs / test
          fixtures that intentionally show key-shaped placeholders).

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=5000']
        # 5MB cap — scored JSONL files are typically <100KB but chart PNGs
        # can be larger. Hard ceiling, not a stylistic preference.
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: '\.env$|\.env\.example$'
      - id: trailing-whitespace
        exclude: '\.env$|\.env\.example$'

  # The analysis self-test. Zero API cost, runs against the committed May data.
  #
  # This exists because the analysis half of the pipeline could fail SILENTLY:
  # ci_analysis.py and robustness_checks.py read a directory the repo does not ship,
  # printed [skip] to stderr, and exited 0 -- so a finished study produced no
  # confidence intervals and no FDR correction while the run script reported success.
  # Eight assertions reproduce the published table, the FDR outcome, the agreement
  # figures, argv-order independence, credential resolution, loud failure on a missing
  # run, protocol-file presence, and the known manifest defects.
  #
  # Runs on push rather than on every commit: G1 and G4 do real bootstrap work and take
  # about a minute together, which is too slow to sit in front of a one-line edit but
  # exactly right in front of a publish.
  - repo: local
    hooks:
      - id: selftest-analysis
        name: Analysis self-test (G1-G8)
        entry: python scripts/selftest_analysis.py
        language: system
        pass_filenames: false
        stages: [pre-push]
