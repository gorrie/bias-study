# Every gate this study relies on, run where a replicator can see it fail.
#
# WHY THIS EXISTS
# ---------------
# Until 2026-09-06 this repository had no CI. The checks existed and ran as a local pre-commit
# hook on one machine, which means a person who cloned the repo to reproduce the study had no
# way to know whether it still verified -- and no way to tell, if their own numbers differed,
# whether the fault was theirs.
#
# The README promises specific numbers ("floor_table.py should print presentation order at 84
# pairs and same-version variants at 97; power.py should put the order threshold at 13 and the
# same-version detection limit at 11"). A promise a reader can check is a test. It is one here.
#
# Nothing in this workflow needs an API key. Collection needs one; verification does not, which
# is the point of shipping the run data.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The instrument is licensed third-party text and is NOT in this repository. This gate is
      # the reason it can stay that way: it scans every tracked file against a fingerprint list
      # so a future commit cannot reintroduce the questionnaire by accident. It has caught a
      # bulk copy once already.
      - name: No third-party instrument text
        run: python scripts/check_corpus.py --all

      # The answer parser is what turns 62 lines of prose into a scoreable sheet. Every number
      # downstream depends on it being strict, so its fixtures run before anything else.
      - name: Parser fixtures
        run: python scripts/test_compass_parser.py

      # BOTH DIRECTORIES. `pytest scripts/` alone collected 53 of 144 tests, so 91
      # of them -- 63% -- never ran in CI. The unrun ones are the regressions for
      # defects this repository has already fixed once: test_eligibility.py
      # (DATA-EMPTY-SCORES-002), test_release_check.py (the gate that exited 0
      # while printing failures), test_surface_gate.py ("every website surface that
      # states a study number must be gated"), test_pipeline_rung.py,
      # test_analysis_empty_tables.py. They passed the whole time, and nothing
      # would have told anyone if they stopped.
      - name: Analysis tests
        run: python -m pytest scripts/ tests/ -q

      # A SUITE THAT COLLECTS ALMOST NOTHING MUST NOT PASS. If a rename, a moved
      # directory or a broken import silently shrinks collection, the step above
      # still exits 0 over whatever survived. This floor is deliberately well below
      # the current count so it fails on collapse, not on ordinary churn.
      - name: Test collection floor
        run: |
          python - <<'PY'
          import re, subprocess, sys
          out = subprocess.run([sys.executable, "-m", "pytest", "scripts/", "tests/",
                                "--collect-only", "-q"],
                               capture_output=True, text=True).stdout
          m = re.search(r"(\d+)\s+tests? collected", out)
          n = int(m.group(1)) if m else 0
          print("collected %d test(s)" % n)
          if n < 120:
              sys.exit("COLLECTED ONLY %d TESTS -- the suite has collapsed, not passed." % n)
          PY

      # THE README'S OWN PROMISE, AS A TEST. If these move, either the data changed or the
      # analysis did, and a replicator is entitled to be told which.
      - name: Replication assertions
        run: |
          python - <<'PY'
          import subprocess, sys, re
          out = subprocess.run([sys.executable, "scripts/floor_table.py"],
                               capture_output=True, text=True).stdout
          want = {"presentation order": 84, "same-version variants": 97}
          bad = []
          for row, pairs in want.items():
              m = re.search(re.escape(row) + r"\s+(\d+)", out)
              got = int(m.group(1)) if m else None
              if got != pairs:
                  bad.append("%s: README promises %d pairs, floor_table prints %s"
                             % (row, pairs, got))
          if bad:
              print("\n".join(bad))
              print("\nThe README tells readers to expect these. Fix the number or the prose.")
              sys.exit(1)
          print("floor_table matches the pair counts the README promises")
          PY

      # Generated blocks and prose numbers must agree with the run data. These are the gates
      # that caught a retracted claim standing in one surface after being corrected in another.
      - name: README generated blocks are current
        run: python scripts/gen_readme.py --check

      - name: Script inventory is current
        run: python scripts/gen_script_inventory.py --check

      - name: Stated numbers agree with the run data
        run: python scripts/key_numbers.py --check
