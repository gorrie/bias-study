[pytest]
# WITHDRAWN MATERIAL IS NOT COLLECTED.
#
# `withdrawn/` holds retired instruments and the machinery that served them -- the external
# 62-proposition questionnaire, the 60-item bank an assistant generated and substituted for
# the author's instrument, and the generators and tests that belong to each. They are kept on
# disk rather than deleted because the record of what was collected under them matters, and
# because this project does not delete evidence.
#
# They must not run. Without this, retiring a bank moved its test file into `withdrawn/` and
# pytest went on collecting it from there: 20 failures asserting facts about a file that had
# deliberately been moved out of `data/`, in a suite whose whole job is to be believed.
#
# `export/` is generated output and `abliteration-output/` is model weights; neither holds
# tests, and walking them costs seconds on every run.
norecursedirs = withdrawn export abliteration-output .git __pycache__ .pytest_cache

# Both real test locations. `scripts/test_*.py` predates `tests/` and still holds
# test_analysis_plumbing.py, which gates the paper's numbers.
testpaths = tests scripts
